name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, xml, xmlreader, xmlwriter, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --locked --abandoned=report --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite
      - name: Run migrations and guarded demo seeder
        run: |
          ALLOW_DEMO_SEEDING=true \
          DEMO_PASSWORD="$(php -r 'echo bin2hex(random_bytes(16));')" \
          php artisan migrate:fresh --seed
      - run: php artisan test
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: php artisan l5-swagger:generate

  mysql-stock-integrity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stockmanager_test
          MYSQL_USER: stockmanager
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: stockmanager_test
      DB_USERNAME: stockmanager
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, xml, xmlreader, xmlwriter, zip, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --locked --abandoned=report --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php artisan test --filter=StockConcurrencyTest
